name: cmk_security
description: CMK Security - App & File Lock with Vault
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1

  # Permissions
  permission_handler: ^11.3.1

  # Storage & files
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2

  # Crypto
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # UI
  gap: ^3.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
